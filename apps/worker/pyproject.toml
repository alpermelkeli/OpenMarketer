[project]
name = "openmarketer-worker"
version = "0.0.0"
description = "OpenMarketer Temporal worker: agent runtime, analyzer"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "openmarketer-core",
    "openmarketer-extractors",
    "temporalio>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmarketer_worker"]

[tool.uv.sources]
openmarketer-core = { workspace = true }
openmarketer-extractors = { workspace = true }
