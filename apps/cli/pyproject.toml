[project]
name = "openmarketer-cli"
version = "0.0.0"
description = "OpenMarketer CLI: setup, onboarding, dry-run"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "openmarketer-core",
    "typer>=0.27.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmarketer_cli"]

[tool.uv.sources]
openmarketer-core = { workspace = true }
