[project]
name = "openmarketer-api"
version = "0.0.0"
description = "OpenMarketer FastAPI service"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.142.4",
    "openmarketer-core",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmarketer_api"]

[tool.uv.sources]
openmarketer-core = { workspace = true }
