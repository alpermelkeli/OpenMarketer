# OpenMarketer - LLM model configuration
#
# Every place in the system that calls a language model is a "role".
# Each role resolves to a model through OpenRouter. Change the model of any
# role here, in the dashboard (Settings -> Models), or with an environment
# variable. See .env.example for the environment variables.
#
# Resolution order for a role (first match wins):
#   1. environment variable   LLM_MODEL__<ROLE>        (e.g. LLM_MODEL__WRITER)
#   2. project setting        dashboard, stored in the database
#   3. workspace setting      dashboard, stored in the database
#   4. this file: role.model
#   5. the role's tier: LLM_MODEL_<TIER>, then the workspace's choice in the
#      dashboard, then this file's tiers.<tier>
#   6. this file: defaults.model
#
# The dashboard also marks models whose requests leave out the temperature, in
# addition to unsupported_parameters below. The command line reads this file and
# the environment only.
#
# IMPORTANT: model slugs use OpenRouter's "provider/model" form and change as
# models are released and retired. Check them against the catalogue at
# https://openrouter.ai/models; `python config/llm_config.py show` prints
# the model each role resolves to.

version: 1

provider:
  name: openrouter
  base_url: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  # Yes-or-no questions answered with a probability each (alpha); used by roles of kind decisions
  decisions_url: ${OPENROUTER_DECISIONS_URL:-https://openrouter.ai/api/alpha/decisions}
  api_key_env: OPENROUTER_API_KEY
  # Optional attribution headers (HTTP-Referer, X-Title)
  app_url: ${OPENROUTER_APP_URL:-}
  app_name: ${OPENROUTER_APP_NAME:-OpenMarketer}
  # Sent to OpenRouter as provider-routing preferences on every chat request (not on a
  # decisions request: see ModelRouter.build_decision_request)
  routing:
    allow_fallbacks: true
    require_parameters: true     # only use upstream providers that support the requested features (tools, structured output)
    data_collection: deny        # ask OpenRouter to avoid providers that may retain or train on prompts

# Three reusable model classes. Change a tier and every role that uses it follows.
tiers:
  fast: anthropic/claude-haiku-5.5           # cheap, quick: classification, short replies
  balanced: anthropic/claude-sonnet-5.5     # default workhorse: writing, planning
  strong: anthropic/claude-opus-5.5         # hard reasoning: planning, strategy

defaults:
  model: anthropic/claude-sonnet-5.5
  temperature: 0.4
  max_tokens: 4096
  timeout_s: 120
  fallbacks:                                 # tried in order if the primary model or its providers fail
    - anthropic/claude-haiku-5.5

# Request parameters a model's providers reject. routing.require_parameters makes OpenRouter
# answer 404 ("No endpoints found that can handle the requested parameters") to a request that
# carries one, so the router leaves them out for these models and sends them to every other.
# The catalogue lists what each model accepts: GET /models/<slug>/endpoints, supported_parameters.
# The list applies to the request's first model; its fallbacks receive the same request.
unsupported_parameters:
  anthropic/claude-haiku-5.5: [temperature]
  anthropic/claude-sonnet-5.5: [temperature]
  anthropic/claude-opus-5.5: [temperature]

# Soft guard per request; the monthly cap in .env (LLM_MONTHLY_CAP_USD) is enforced by the budget ledger.
limits:
  max_cost_per_call_usd: 1.50

roles:
  # --- operator-facing -------------------------------------------------
  orchestrator:                  # dashboard chat: status questions and special requests, and the
                                 # worker's follow-up turn after a research run the chat started
    tier: strong
    temperature: 0.3
    max_tokens: 4096
    requires: [tools]            # reads data and creates requests through tools; never executes them directly

  # --- understanding ---------------------------------------------------
  repo_analyzer:                 # explores the repository with read-only tools and drafts the Product Profile
    tier: fast                   # by design: analysing a repository costs nothing; its output is checked in code and reviewed by a person
    temperature: 0.1
    max_tokens: 8192
    requires: [tools, structured_output]
  researcher:                    # market, competitor and trend research summaries
    tier: balanced
    temperature: 0.3
    max_tokens: 16384              # thinking counts against this cap: a real run's synthesis spent the 4096 default on reasoning and never submitted, twice
    requires: [tools]
  reader:                        # quarantined reader: classifies untrusted comments, DMs, web text
    tier: fast
    temperature: 0.0
    max_tokens: 8192               # room for a reading at the schema's own bounds plus a thinking model's reasoning; at 3072, two real-run readings were cut off mid-thinking and asked again
    requires: [structured_output]   # NO tools by design

  # --- planning and creating ------------------------------------------
  planner:                       # weekly plan, channel mix, ad plan
    tier: strong
    temperature: 0.4
    requires: [structured_output]
  writer:                        # posts, captions, threads, ad copy in brand voice
    tier: balanced
    temperature: 0.8
    max_tokens: 2048
  reply_drafter:                 # replies to the project's own audience
    tier: balanced
    temperature: 0.5
    max_tokens: 512
  creative_director:             # writes prompts and scripts for image, video and voice providers
    tier: balanced
    temperature: 0.7
    max_tokens: 16384              # a brief, and the HTML of a layout the studio renders
    requires: [structured_output, vision]   # vision: the product's repository images, on a contact sheet

  # --- checking and learning ------------------------------------------
  studio:                        # creative studio agent: writes code, calls image/video/voice tools, looks at results, edits
    tier: strong
    temperature: 0.4
    max_tokens: 32768              # programs and HTML pages it writes for the sandbox
    requires: [tools, vision]      # must see the images it produces

  asset_verifier:                  # checks every produced asset against the brief; keep it a different model from `studio`
    tier: balanced
    temperature: 0.0
    max_tokens: 16384
    requires: [structured_output, vision]

  critic:                        # pre-approval quality check against brand voice and facts
    tier: balanced
    temperature: 0.0
    requires: [structured_output]
  analyst:                       # interprets metrics, writes the weekly report and proactive digests
    tier: balanced
    temperature: 0.2
    requires: [structured_output]
  vision:                        # understands screenshots and creative assets
    tier: balanced
    requires: [vision]
  judge:                         # offline evaluation (LLM-as-judge); keep separate from the writer's model
    tier: strong
    temperature: 0.0
    requires: [structured_output]

  # --- deciding (separate endpoint kind) --------------------------------
  # A decisions role names its model and takes nothing else. Its models are not in the chat
  # catalogue (https://openrouter.ai/models), so the dashboard does not check them against it.
  screener:                      # drops search results whose title and snippet do not bear on the research request
    kind: decisions              # reads untrusted text and answers probabilities only: it cannot call a tool or write text
    model: respan/span-02

  # --- drawing (chat endpoint, image output) ----------------------------
  # An images role names its model (the tiers are chat models) and takes no temperature, length
  # limit or reasoning effort. Its fallbacks are its own (defaults.fallbacks are chat models) and
  # are tried in order when its model fails, as a chat role's are; the version keeps the model
  # that answered. Each of its models must answer with images (the catalogue's
  # output_modalities). estimate_usd_per_image is what one image is reckoned to cost before it is
  # made, for a budget to hold, whichever model answers; the catalogue prices image output per
  # token only, and how many tokens an image is depends on the model. The cost the provider
  # reports is what is kept.
  image_generator:               # makes and edits the studio's images, the text in them included
    kind: images
    model: bytedance-seed/seedream-5-0-flash   # image only; Turkish copy right 2/2 at 0.018 USD
    fallbacks: [google/gemini-3.1-flash-lite-image]   # 0.034 USD, fast; when the first is busy
    requires: [image_output, vision]   # vision: an image to edit and references are sent as images
    # One figure for whichever model answers, held in the budget before each image; the actual
    # cost is committed afterwards. Measured on one Turkish feature announcement: Seedream 5 Flash
    # 0.018, Gemini 3.1 Flash Lite Image 0.034, Recraft v4.1 0.035, Seedream 5 Pro 0.09, Gemini 3
    # Pro Image 0.14, GPT Image 2 (openai/gpt-5.4-image-2) 0.24; Gemini 2.5 Flash Image misspelt.
    estimate_usd_per_image: 0.04

  # --- retrieval (separate endpoint kind) -------------------------------
  embeddings:                    # memory embeddings; switch provider if your OpenRouter plan lacks this endpoint
    kind: embeddings
    model: openai/text-embedding-3-small
    dimensions: 1536
