# Egress proxy of the studio's sandbox (deploy/compose/dev.yml, started by make up).
# The install phase reaches the network only through here, and only PyPI over HTTPS: a
# CONNECT to pypi.org or files.pythonhosted.org on port 443. Everything else is refused.
http_port 3128

acl pypi dstdomain pypi.org files.pythonhosted.org
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !tls_port
http_access allow CONNECT pypi
http_access deny all

# A forward proxy for one purpose: no cache, no identifying headers, no on-disk state.
cache deny all
cache_mem 0 MB
via off
forwarded_for delete
coredump_dir /tmp
