[project]
name = "openmarketer-core"
version = "0.0.0"
description = "OpenMarketer core: schemas, agent runtime, policy engine, ledger"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.109",
    "httpx>=0.28.1",
    "langgraph>=1.2.14,<2",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.26.0",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmarketer_core"]
