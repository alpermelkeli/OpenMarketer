[project]
name = "openmarketer-evaluation"
version = "0.0.0"
description = "OpenMarketer evaluation: golden-repository benchmark of the repository analyzer"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "openmarketer-core",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmarketer_evaluation"]

[tool.uv.sources]
openmarketer-core = { workspace = true }
